# The authoring lane drives the location affordance. A real desktop open
# would pop a file manager on the machine running the tests and the
# capability itself is platform-detected (macOS yes, headless Linux CI no),
# so the remaining native-open owner is pinned headless: the same branch on
# every host, and the one whose rendering a golden can hold. A patch replaces
# the row's complete config, so the shipped routing defaults ride along.
- id: session-controller
  config:
    nativeOpen: false
